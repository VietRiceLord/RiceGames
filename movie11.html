<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rice Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #070b16;
    color: #e6eaff;
    overflow-y: auto;
}

/* NAV */
nav {
    padding: 16px 20px;
    background: rgba(15,25,55,0.6);
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 5;
}

#search {
    flex: 1;
    padding: 10px 14px;
    background: #0e1630;
    border: 1px solid rgba(120,180,255,.4);
    color: white;
    border-radius: 10px;
}

h3 {
    padding: 0 20px;
}

/* FEATURED */
#featured {
    display: flex;
    gap: 14px;
    padding: 20px;
    overflow-x: auto;
}

/* GRID */
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    padding: 20px;
}

/* CARD */
.card {
    background: #0e1630;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    border: 1px solid rgba(120,180,255,.15);
    transition: .25s;
}

.card:hover {
    transform: scale(1.06);
    box-shadow: 0 0 25px rgba(100,180,255,.7);
}

.card img {
    width: 100%;
    height: 185px;
    object-fit: cover;
    border-radius: 8px;
}

.card div {
    margin-top: 6px;
    text-align: center;
    font-size: .85rem;
}

/* PLAYER OVERLAY */
#player {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    flex-direction: column;
}

/* PLAYER TOP BAR */
#playerTop {
    padding: 10px;
    background: rgba(20,30,60,.9);
    display: flex;
    gap: 10px;
}

#playerTop button {
    padding: 8px 14px;
    background: #1b264a;
    border: 1px solid rgba(120,180,255,.4);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* PLAYER BODY */
#playerBody {
    flex: 1;
    display: flex;
    overflow: hidden;
}

/* VIDEO */
#frame {
    flex: 1;
    border: none;
}

/* EPISODE SIDEBAR */
#sidebar {
    width: 300px;
    background: #0b122a;
    border-left: 1px solid rgba(120,180,255,.2);
    display: none;
    flex-direction: column;
}

#sidebarHeader {
    padding: 12px;
    display: flex;
    gap: 8px;
}

#seasonSelect {
    flex: 1;
    padding: 8px;
    background: #0e1630;
    color: white;
    border: 1px solid rgba(120,180,255,.4);
    border-radius: 6px;
}

#episodes {
    flex: 1;
    overflow-y: auto;
}

.episode {
    padding: 14px;
    border-bottom: 1px solid rgba(120,180,255,.15);
    cursor: pointer;
}

.episode:hover {
    background: rgba(120,180,255,.15);
}
</style>
</head>

<body>

<nav>
    <strong>Rice Movies</strong>
    <input id="search" placeholder="Search movies or shows...">
</nav>

<h3>Featured</h3>
<div id="featured"></div>

<h3>All</h3>
<div id="grid"></div>

<!-- PLAYER -->
<div id="player">
    <div id="playerTop">
        <button onclick="closePlayer()">Back</button>
        <button onclick="toggleSidebar()">Episodes</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div id="playerBody">
        <iframe id="frame"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

        <div id="sidebar">
            <div id="sidebarHeader">
                <select id="seasonSelect"></select>
            </div>
            <div id="episodes"></div>
        </div>
    </div>
</div>

<script>
const SOURCES_URL = "https://cdn.jsdelivr.net/gh/VietRiceLord/RiceGames@main/moviejson/moviesources3.json";

let allData = [];
let currentShow = null;

const featured = document.getElementById("featured");
const grid = document.getElementById("grid");
const search = document.getElementById("search");

const player = document.getElementById("player");
const frame = document.getElementById("frame");
const sidebar = document.getElementById("sidebar");
const episodesDiv = document.getElementById("episodes");
const seasonSelect = document.getElementById("seasonSelect");

/* INITIAL STATE */
player.style.display = "none";
sidebar.style.display = "none";
frame.src = "";

/* FETCH MASTER LIST OF JSONS */
fetch(SOURCES_URL)
    .then(r => r.json())
    .then(urls => Promise.all(urls.map(url => fetch(url).then(r => r.json()))))
    .then(results => {
        // Merge all JSON data into a single array
        allData = results.flat();
        renderFeatured(allData.filter(i => i.featured));
        renderGrid(allData);
    })
    .catch(err => console.error("Error loading JSONs:", err));

/* SEARCH */
search.oninput = () => {
    const q = search.value.toLowerCase();
    renderGrid(allData.filter(i => i.title.toLowerCase().includes(q)));
};

/* RENDER */
function renderFeatured(list) {
    featured.innerHTML = "";
    list.forEach(i => createCard(i, featured));
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(i => createCard(i, grid));
}

function createCard(item, parent) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${item.poster}"><div>${item.title}</div>`;
    div.onclick = () => openItem(item);
    parent.appendChild(div);
}

/* PLAYER */
function openItem(item) {
    if (item.type === "movie") {
        openPlayer(item.url);
    } else {
        openShow(item);
    }
}

function openPlayer(url) {
    sidebar.style.display = "none";
    frame.src = url;
    player.style.display = "flex";
}

function closePlayer() {
    frame.src = "";
    player.style.display = "none";
    sidebar.style.display = "none";
    if (document.fullscreenElement) document.exitFullscreen();
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        player.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

/* TV SHOWS */
function openShow(show) {
    currentShow = show;
    sidebar.style.display = "flex";
    player.style.display = "flex";
    episodesDiv.innerHTML = "";
    seasonSelect.innerHTML = "";

    show.seasons.forEach((s, i) => {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = "Season " + s.season;
        seasonSelect.appendChild(o);
    });

    seasonSelect.onchange = () => loadSeason(+seasonSelect.value);
    loadSeason(0);
}

function loadSeason(i) {
    episodesDiv.innerHTML = "";
    currentShow.seasons[i].episodes.forEach(e => {
        const div = document.createElement("div");
        div.className = "episode";
        div.textContent = e.title;
        div.onclick = () => openPlayer(e.url);
        episodesDiv.appendChild(div);
    });
}

/* SIDEBAR TOGGLE */
function toggleSidebar() {
    sidebar.style.display = sidebar.style.display === "flex" ? "none" : "flex";
}
</script>


</body>
</html>
