<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rice Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #e6eaff;
    background:
        radial-gradient(circle at 20% 20%, rgba(80,140,255,0.15), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(140,80,255,0.15), transparent 45%),
        #070b16;
    background-attachment: fixed;
}

/* STARFIELD */
#stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
        radial-gradient(2px 2px at 20% 30%, #9bdcff, transparent),
        radial-gradient(1px 1px at 80% 70%, #fff, transparent),
        radial-gradient(2px 2px at 50% 50%, #7aa2ff, transparent);
    animation: drift 120s linear infinite;
}
@keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 1200px 2000px; }
}

/* NAV */
nav {
    padding: 16px 20px;
    background: rgba(15,25,55,0.55);
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    gap: 15px;
}

nav span {
    font-size: 1.3rem;
    font-weight: bold;
}

/* SEARCH */
#search {
    flex: 1;
    padding: 10px 14px;
    background: #0e1630;
    border: 1px solid rgba(120,180,255,0.4);
    color: white;
    border-radius: 10px;
    outline: none;
}

h3 {
    padding: 0 20px;
    margin-top: 24px;
}

/* FEATURED SLIDER */
#featured {
    display: flex;
    gap: 14px;
    padding: 20px;
    overflow-x: auto;
    scroll-behavior: smooth;
}

/* GRID */
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    padding: 20px;
}

/* CARD */
.card {
    background: linear-gradient(180deg, #10182d, #0b1222);
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    border: 1px solid rgba(120,180,255,0.15);
    transition: 0.25s;
}

.card:hover {
    transform: translateY(-4px) scale(1.07);
    box-shadow: 0 0 35px rgba(100,180,255,0.7);
    border-color: rgba(140,220,255,0.8);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 8px;
}

.card div {
    margin-top: 6px;
    font-size: 0.9rem;
    font-weight: bold;
    text-align: center;
}

/* PLAYER */
#player {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 50;
    flex-direction: column;
}

#playerTop {
    padding: 10px;
    background: rgba(20,30,60,0.8);
    display: flex;
    gap: 10px;
}

#playerTop button {
    padding: 8px 14px;
    background: #1b264a;
    border: 1px solid rgba(120,180,255,0.4);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

#player iframe {
    flex: 1;
    width: 100%;
    border: none;
}

/* EPISODES */
#episodeMenu {
    display: none;
    position: fixed;
    inset: 0;
    background: #070b16;
    z-index: 60;
}

#episodeMenuTop {
    padding: 15px;
    display: flex;
    gap: 10px;
}

#seasonSelect {
    padding: 10px;
    background: #0e1630;
    color: white;
    border: 1px solid rgba(120,180,255,0.4);
    border-radius: 8px;
}

.episode {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(120,180,255,0.15);
    cursor: pointer;
}

.episode:hover {
    background: rgba(120,180,255,0.15);
}

/* MOBILE */
@media (max-width: 900px) {
    #grid { grid-template-columns: repeat(auto-fill, minmax(42vw, 1fr)); }
    .card img { height: 42vw; }
}
</style>
</head>
<body>

<div id="stars"></div>

<nav>
    <span>Rice Movies</span>
    <input id="search" placeholder="Search movies or TV shows...">
</nav>

<h3>Featured</h3>
<div id="featured"></div>

<h3>All</h3>
<div id="grid"></div>

<!-- PLAYER -->
<div id="player">
    <div id="playerTop">
        <button onclick="closePlayer()">Back</button>
    </div>
    <iframe id="frame"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<!-- EPISODE MENU -->
<div id="episodeMenu">
    <div id="episodeMenuTop">
        <button onclick="closeEpisodes()">Back</button>
        <select id="seasonSelect"></select>
    </div>
    <div id="episodes"></div>
</div>

<script>
const DATA_URL = "https://cdn.jsdelivr.net/gh/VietRiceLord/RiceGames@main/moviejson/movie.json";

let allData = [];
let currentShow = null;
let currentSeasonIndex = 0;
let currentEpisodeIndex = 0;

const featured = document.getElementById("featured");
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const player = document.getElementById("player");
const frame = document.getElementById("frame");
const episodeMenu = document.getElementById("episodeMenu");
const episodesDiv = document.getElementById("episodes");
const seasonSelect = document.getElementById("seasonSelect");

fetch(DATA_URL)
.then(r => r.json())
.then(data => {
    allData = data;
    renderFeatured(data.filter(i => i.featured));
    renderGrid(data);
});

search.oninput = () => {
    const q = search.value.toLowerCase();
    renderGrid(allData.filter(i => i.title.toLowerCase().includes(q)));
};

function renderFeatured(list) {
    featured.innerHTML = "";
    list.forEach(item => createCard(item, featured));
    setInterval(() => featured.scrollBy({ left: 200, behavior: "smooth" }), 4000);
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(item => createCard(item, grid));
}

function createCard(item, parent) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${item.poster}"><div>${item.title}</div>`;
    div.onclick = () => openItem(item);
    parent.appendChild(div);
}

function openItem(item) {
    if (item.type === "movie") {
        openPlayer(item.url);
    } else {
        openEpisodes(item);
    }
}

function openPlayer(url) {
    frame.src = url;
    player.style.display = "flex";
}

function closePlayer() {
    frame.src = "";
    player.style.display = "none";
}

function openEpisodes(show) {
    currentShow = show;
    episodeMenu.style.display = "block";
    seasonSelect.innerHTML = "";

    show.seasons.forEach((s, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = "Season " + s.season;
        seasonSelect.appendChild(opt);
    });

    seasonSelect.onchange = () => loadSeason(+seasonSelect.value);
    loadSeason(0);
}

function loadSeason(index) {
    currentSeasonIndex = index;
    episodesDiv.innerHTML = "";
    currentShow.seasons[index].episodes.forEach((e, i) => {
        const div = document.createElement("div");
        div.className = "episode";
        div.textContent = e.title;
        div.onclick = () => {
            currentEpisodeIndex = i;
            openPlayer(e.url);
        };
        episodesDiv.appendChild(div);
    });
}

frame.addEventListener("load", () => {
    frame.contentWindow?.addEventListener("ended", autoNextEpisode);
});

function autoNextEpisode() {
    const eps = currentShow?.seasons[currentSeasonIndex]?.episodes;
    if (!eps) return;
    currentEpisodeIndex++;
    if (eps[currentEpisodeIndex]) {
        openPlayer(eps[currentEpisodeIndex].url);
    }
}

function closeEpisodes() {
    episodeMenu.style.display = "none";
}
</script>

</body>
</html>
