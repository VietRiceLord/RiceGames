<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rice Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #e6eaff;
    background:
        radial-gradient(circle at 20% 20%, rgba(80,140,255,0.15), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(140,80,255,0.15), transparent 45%),
        #070b16;
    background-attachment: fixed;
}

/* STARFIELD */
#stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
        radial-gradient(2px 2px at 20% 30%, #9bdcff, transparent),
        radial-gradient(1px 1px at 80% 70%, #fff, transparent),
        radial-gradient(2px 2px at 50% 50%, #7aa2ff, transparent);
    animation: drift 120s linear infinite;
}

@keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 1200px 2000px; }
}

/* NAV */
nav {
    padding: 16px 20px;
    background: rgba(15,25,55,0.45);
    backdrop-filter: blur(14px);
    font-size: 1.3rem;
    font-weight: bold;
}

/* HEADERS */
h3 {
    padding: 0 20px;
    margin-top: 24px;
}

/* GRIDS */
#featured,
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    padding: 20px;
}

/* CARDS */
.card {
    background: linear-gradient(180deg, #10182d, #0b1222);
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    border: 1px solid rgba(120,180,255,0.15);
    transition: 0.25s;
    overflow: hidden;
}

.card:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 0 25px rgba(80,160,255,0.45);
    border-color: rgba(120,200,255,0.6);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 8px;
}

.card div {
    margin-top: 6px;
    font-size: 0.9rem;
    font-weight: bold;
    text-align: center;
}

/* PLAYER */
#player {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 50;
    flex-direction: column;
}

#playerTop {
    padding: 10px;
    background: rgba(20,30,60,0.8);
    display: flex;
    gap: 10px;
}

#playerTop button {
    padding: 8px 14px;
    background: #1b264a;
    border: 1px solid rgba(120,180,255,0.4);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

#player iframe {
    flex: 1;
    width: 100%;
    border: none;
}

/* EPISODES */
#episodeMenu {
    display: none;
    position: fixed;
    inset: 0;
    background: #070b16;
    z-index: 60;
    overflow-y: auto;
}

#episodeMenu button {
    margin: 16px;
    padding: 10px 16px;
    background: #1b264a;
    border: 1px solid rgba(120,180,255,0.4);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.episode {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(120,180,255,0.15);
    cursor: pointer;
}

.episode:hover {
    background: rgba(120,180,255,0.12);
}

/* MOBILE */
@media (max-width: 900px) {
    #featured,
    #grid {
        grid-template-columns: repeat(auto-fill, minmax(42vw, 1fr));
    }

    .card img {
        height: 42vw;
    }
}
</style>
</head>
<body>

<div id="stars"></div>

<nav>Rice Movies</nav>

<h3>Featured</h3>
<div id="featured"></div>

<h3>All</h3>
<div id="grid"></div>

<!-- PLAYER -->
<div id="player">
    <div id="playerTop">
        <button onclick="closePlayer()">Back</button>
    </div>
    <iframe id="frame"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<!-- EPISODE MENU -->
<div id="episodeMenu">
    <button onclick="closeEpisodes()">Back</button>
    <div id="episodes"></div>
</div>

<script>
const DATA_URL = "https://cdn.jsdelivr.net/gh/VietRiceLord/RiceGames@main/moviejson/movie.json";

const featured = document.getElementById("featured");
const grid = document.getElementById("grid");
const player = document.getElementById("player");
const frame = document.getElementById("frame");
const episodeMenu = document.getElementById("episodeMenu");
const episodesDiv = document.getElementById("episodes");

fetch(DATA_URL)
.then(r => r.json())
.then(data => {
    renderFeatured(data.filter(i => i.featured));
    renderGrid(data);
});

function renderFeatured(list) {
    featured.innerHTML = "";
    list.forEach(item => createCard(item, featured));
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(item => createCard(item, grid));
}

function createCard(item, parent) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
        <img src="${item.poster}">
        <div>${item.title}</div>
    `;
    div.onclick = () => openItem(item);
    parent.appendChild(div);
}

function openItem(item) {
    if (item.type === "movie") {
        openPlayer(item.url);
    } else {
        openEpisodes(item);
    }
}

function openPlayer(url) {
    frame.src = url;
    player.style.display = "flex";
}

function closePlayer() {
    frame.src = "";
    player.style.display = "none";
}

function openEpisodes(show) {
    episodeMenu.style.display = "block";
    episodesDiv.innerHTML = "";

    show.seasons.forEach(s => {
        const h = document.createElement("h4");
        h.style.padding = "0 20px";
        h.textContent = "Season " + s.season;
        episodesDiv.appendChild(h);

        s.episodes.forEach(e => {
            const div = document.createElement("div");
            div.className = "episode";
            div.textContent = e.title;
            div.onclick = () => {
                episodeMenu.style.display = "none";
                openPlayer(e.url);
            };
            episodesDiv.appendChild(div);
        });
    });
}

function closeEpisodes() {
    episodeMenu.style.display = "none";
}
</script>

</body>
</html>
