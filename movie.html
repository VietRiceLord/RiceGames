<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rice Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
    --neon-blue: #4fc3ff;
    --neon-purple: #9b6cff;
}

body {
    margin: 0;
    background: radial-gradient(circle at top, #10162c, #05070f);
    color: white;
    font-family: Arial, sans-serif;
}

/* NAVBAR */
nav {
    padding: 14px 20px;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(12px);
    font-weight: bold;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

/* SECTIONS */
h3 {
    margin: 20px 20px 8px;
    font-size: 16px;
    color: #cfe6ff;
}

/* FEATURED */
#featured {
    display: flex;
    gap: 14px;
    padding: 0 20px 10px;
    overflow-x: auto;
}

/* GRID */
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 16px;
    padding: 0 20px 30px;
}

/* CARD */
.card {
    cursor: pointer;
    background: rgba(20,30,60,.6);
    border-radius: 10px;
    padding: 6px;
    transition: 0.25s;
    border: 1px solid rgba(255,255,255,.08);
}

.card img {
    width: 100%;
    height: 165px;
    object-fit: cover;
    border-radius: 8px;
}

.card div {
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
    color: #dbeaff;
}

/* NEON HOVER */
.card:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow:
        0 0 12px var(--neon-blue),
        0 0 24px rgba(79,195,255,.5);
    border-color: var(--neon-blue);
}

/* PLAYER */
#player {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 10;
    flex-direction: column;
}

#playerTop {
    padding: 8px;
    background: rgba(255,255,255,.08);
    display: flex;
    gap: 10px;
}

#playerTop button {
    background: #121b3a;
    border: 1px solid rgba(255,255,255,.2);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
}

#playerTop button:hover {
    box-shadow: 0 0 10px var(--neon-purple);
}

#player iframe {
    flex: 1;
    border: none;
}

/* EPISODES */
#episodeMenu {
    display: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, #10162c, #05070f);
    z-index: 20;
    overflow-y: auto;
    padding: 15px;
}

.episode {
    padding: 10px 14px;
    margin-bottom: 6px;
    background: rgba(20,30,60,.6);
    border-radius: 8px;
    cursor: pointer;
    transition: .2s;
    border: 1px solid rgba(255,255,255,.08);
}

.episode:hover {
    box-shadow: 0 0 12px var(--neon-purple);
    border-color: var(--neon-purple);
}
</style>
</head>
<body>

<nav>Rice Movies</nav>

<h3>Featured</h3>
<div id="featured"></div>

<h3>All</h3>
<div id="grid"></div>

<!-- PLAYER -->
<div id="player">
    <div id="playerTop">
        <button onclick="closePlayer()">Back</button>
    </div>
    <iframe id="frame"></iframe>
</div>

<!-- EPISODE MENU -->
<div id="episodeMenu">
    <button onclick="closeEpisodes()">Back</button>
    <div id="episodes"></div>
</div>

<script>
const DATA_URL = "https://cdn.jsdelivr.net/gh/VietRiceLord/RiceGames@main/moviejson/movie.json";

const featured = document.getElementById("featured");
const grid = document.getElementById("grid");
const player = document.getElementById("player");
const frame = document.getElementById("frame");
const episodeMenu = document.getElementById("episodeMenu");
const episodesDiv = document.getElementById("episodes");

fetch(DATA_URL)
.then(r => r.json())
.then(data => {
    renderFeatured(data.filter(i => i.featured));
    renderGrid(data);
});

function renderFeatured(list) {
    featured.innerHTML = "";
    list.forEach(item => createCard(item, featured));
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(item => createCard(item, grid));
}

function createCard(item, parent) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${item.poster}"><div>${item.title}</div>`;
    div.onclick = () => openItem(item);
    parent.appendChild(div);
}

function openItem(item) {
    if (item.type === "movie") openPlayer(item.url);
    else openEpisodes(item);
}

function openPlayer(url) {
    player.style.display = "flex";
    frame.src = url;
}

function closePlayer() {
    frame.src = "";
    player.style.display = "none";
}

function openEpisodes(show) {
    episodeMenu.style.display = "block";
    episodesDiv.innerHTML = "";

    show.seasons.forEach(s => {
        const h = document.createElement("h4");
        h.textContent = "Season " + s.season;
        episodesDiv.appendChild(h);

        s.episodes.forEach(e => {
            const div = document.createElement("div");
            div.className = "episode";
            div.textContent = e.title;
            div.onclick = () => {
                episodeMenu.style.display = "none";
                openPlayer(e.url);
            };
            episodesDiv.appendChild(div);
        });
    });
}

function closeEpisodes() {
    episodeMenu.style.display = "none";
}
</script>

</body>
</html>
