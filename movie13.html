<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rice Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #070b16;
    color: #e6eaff;
}

/* NAV */
nav {
    padding: 16px 20px;
    background: rgba(15,25,55,0.6);
    backdrop-filter: blur(14px);
    display: flex;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 5;
}

#search {
    flex: 1;
    padding: 10px 14px;
    background: #0e1630;
    border: 1px solid rgba(120,180,255,.4);
    color: white;
    border-radius: 10px;
}

h3 { padding: 0 20px; }

/* FEATURED */
#featured {
    display: flex;
    gap: 14px;
    padding: 20px;
    overflow-x: auto;
}

/* GRID */
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    padding: 20px;
}

/* CARD */
.card {
    background: #0e1630;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    border: 1px solid rgba(120,180,255,.15);
    transition: .25s;
}

.card:hover {
    transform: scale(1.06);
    box-shadow: 0 0 25px rgba(100,180,255,.7);
}

.card img {
    width: 100%;
    height: 185px;
    object-fit: cover;
    border-radius: 8px;
}

.card div {
    margin-top: 6px;
    text-align: center;
    font-size: .85rem;
}

/* PLAYER */
#player {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    flex-direction: column;
}

/* PLAYER TOP BAR */
#playerTop {
    padding: 10px;
    background: rgba(20,30,60,.9);
    display: flex;
    gap: 10px;
}

#playerTop button {
    padding: 8px 14px;
    background: #1b264a;
    border: 1px solid rgba(120,180,255,.4);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* PLAYER BODY */
#playerBody {
    flex: 1;
    display: flex;
    overflow: hidden;
}

#frame {
    flex: 1;
    border: none;
}

/* SIDEBAR */
#sidebar {
    width: 300px;
    background: #0b122a;
    border-left: 1px solid rgba(120,180,255,.2);
    display: none;
    flex-direction: column;
}

#sidebarHeader {
    padding: 12px;
}

#seasonSelect {
    width: 100%;
    padding: 8px;
    background: #0e1630;
    color: white;
    border: 1px solid rgba(120,180,255,.4);
    border-radius: 6px;
}

#episodes {
    flex: 1;
    overflow-y: auto;
}

.episode {
    padding: 14px;
    border-bottom: 1px solid rgba(120,180,255,.15);
    cursor: pointer;
}

.episode:hover {
    background: rgba(120,180,255,.15);
}

.episode.active {
    background: linear-gradient(135deg, rgba(80,140,255,.35), rgba(40,90,200,.55));
    border-left: 4px solid #6fb2ff;
    font-weight: bold;
}
</style>
</head>

<body>

<nav>
    <strong>Rice Movies</strong>
    <input id="search" placeholder="Search movies or shows...">
</nav>

<h3>Featured</h3>
<div id="featured"></div>

<h3>All</h3>
<div id="grid"></div>

<!-- PLAYER -->
<div id="player">
    <div id="playerTop">
        <button onclick="closePlayer()">Back</button>
        <button id="episodesBtn" onclick="toggleSidebar()">Episodes</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div id="playerBody">
        <iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe>

        <div id="sidebar">
            <div id="sidebarHeader">
                <select id="seasonSelect"></select>
            </div>
            <div id="episodes"></div>
        </div>
    </div>
</div>

<script>
const SOURCES_URL =
  "https://cdn.jsdelivr.net/gh/VietRiceLord/RiceGames@main/moviejson/moviesources4.json?cache=" + Date.now();

let allData = [];
let currentShow = null;
let activeEpisodeEl = null;

const featured = document.getElementById("featured");
const grid = document.getElementById("grid");
const search = document.getElementById("search");

const player = document.getElementById("player");
const frame = document.getElementById("frame");
const sidebar = document.getElementById("sidebar");
const episodesDiv = document.getElementById("episodes");
const seasonSelect = document.getElementById("seasonSelect");
const episodesBtn = document.getElementById("episodesBtn");

/* FETCH */
fetch(SOURCES_URL)
    .then(r => r.json())
    .then(urls => Promise.all(urls.map(u => fetch(u).then(r => r.json()))))
    .then(results => {
        allData = results.flat();
        renderFeatured(allData.filter(i => i.featured));
        renderGrid(allData);
    });

search.oninput = () => {
    const q = search.value.toLowerCase();
    renderGrid(allData.filter(i => i.title.toLowerCase().includes(q)));
};

function renderFeatured(list) {
    featured.innerHTML = "";
    list.forEach(i => createCard(i, featured));
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(i => createCard(i, grid));
}

function createCard(item, parent) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${item.poster}"><div>${item.title}</div>`;
    div.onclick = () => openItem(item);
    parent.appendChild(div);
}

/* PLAYER */
function openItem(item) {
    if (item.type === "movie") openMovie(item.url);
    else openShow(item);
}

function openMovie(url) {
    currentShow = null;
    episodesBtn.style.display = "none";
    sidebar.style.display = "none";

    frame.src = "";
    setTimeout(() => frame.src = url, 50);

    player.style.display = "flex";
}

function openShow(show) {
    currentShow = show;
    episodesBtn.style.display = "inline-block";
    sidebar.style.display = "flex";
    player.style.display = "flex";

    seasonSelect.innerHTML = "";
    show.seasons.forEach((s, i) => {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = "Season " + s.season;
        seasonSelect.appendChild(o);
    });

    seasonSelect.onchange = () => loadSeason(+seasonSelect.value);
    loadSeason(0);
}

function loadSeason(i) {
    episodesDiv.innerHTML = "";
    activeEpisodeEl = null;

    currentShow.seasons[i].episodes.forEach((e, idx) => {
        const div = document.createElement("div");
        div.className = "episode";
        div.textContent = `E${e.episode} • ${e.title}`;

        div.onclick = () => {
            if (activeEpisodeEl) activeEpisodeEl.classList.remove("active");
            div.classList.add("active");
            activeEpisodeEl = div;
            openMovie(e.url);
        };

        episodesDiv.appendChild(div);

        if (idx === 0) div.onclick();
    });
}

function toggleSidebar() {
    if (!currentShow) return;
    sidebar.style.display = sidebar.style.display === "flex" ? "none" : "flex";
}

function closePlayer() {
    frame.src = "";
    player.style.display = "none";
    sidebar.style.display = "none";
}

function toggleFullscreen() {
    if (!document.fullscreenElement) player.requestFullscreen();
    else document.exitFullscreen();
}
</script>

</body>
</html>
