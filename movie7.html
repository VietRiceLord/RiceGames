<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rice Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial, sans-serif;
    color: #e6eaff;
    background: #070b16;
    overflow-y: auto;
}

/* NAV */
nav {
    padding: 16px 20px;
    background: rgba(15,25,55,0.6);
    backdrop-filter: blur(14px);
    display: flex;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 10;
}

#search {
    flex: 1;
    padding: 10px 14px;
    background: #0e1630;
    border: 1px solid rgba(120,180,255,.4);
    color: white;
    border-radius: 10px;
}

h3 { padding: 0 20px; }

/* FEATURED */
#featured {
    display: flex;
    gap: 14px;
    padding: 20px;
    overflow-x: auto;
}

/* GRID */
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    padding: 20px;
}

/* CARD */
.card {
    background: #0e1630;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    border: 1px solid rgba(120,180,255,.15);
    transition: .25s;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(100,180,255,.5);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 8px;
}

.card div {
    margin-top: 6px;
    text-align: center;
    font-size: .9rem;
}

/* PLAYER OVERLAY */
#player {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 50;
    display: flex;
    flex-direction: column;
}

/* PLAYER TOP */
#playerTop {
    padding: 10px;
    background: rgba(20,30,60,.85);
    display: flex;
    gap: 10px;
}

#playerTop button {
    padding: 8px 14px;
    background: #1b264a;
    border: 1px solid rgba(120,180,255,.4);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* PLAYER BODY */
#playerBody {
    flex: 1;
    display: flex;
    min-height: 0;
}

/* VIDEO */
#frame {
    flex: 1;
    border: none;
}

/* EPISODE SIDEBAR */
#episodeSidebar {
    width: 320px;
    background: #070b16;
    border-left: 1px solid rgba(120,180,255,.2);
    display: none;
    flex-direction: column;
}

/* SIDEBAR TOP */
#episodeTop {
    padding: 12px;
    display: flex;
    gap: 10px;
}

#seasonSelect {
    flex: 1;
    padding: 8px;
    background: #0e1630;
    color: white;
    border: 1px solid rgba(120,180,255,.4);
    border-radius: 8px;
}

/* EPISODE LIST (SCROLLABLE) */
#episodes {
    overflow-y: auto;
    flex: 1;
}

.episode {
    padding: 14px;
    border-bottom: 1px solid rgba(120,180,255,.15);
    cursor: pointer;
}

.episode:hover {
    background: rgba(120,180,255,.15);
}
</style>
</head>
<body>

<nav>
    <strong>Rice Movies</strong>
    <input id="search" placeholder="Search movies or shows...">
</nav>

<h3>Featured</h3>
<div id="featured"></div>

<h3>All</h3>
<div id="grid"></div>

<!-- PLAYER -->
<div id="player">
    <div id="playerTop">
        <button onclick="closePlayer()">Back</button>
        <button onclick="toggleEpisodes()">Episodes</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div id="playerBody">
        <iframe id="frame"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

        <!-- EPISODE SIDEBAR -->
        <div id="episodeSidebar">
            <div id="episodeTop">
                <select id="seasonSelect"></select>
            </div>
            <div id="episodes"></div>
        </div>
    </div>
</div>

<script>
const DATA_URL = "https://cdn.jsdelivr.net/gh/VietRiceLord/RiceGames@main/moviejson/movie4.json";

let allData = [];
let currentShow = null;

const featured = document.getElementById("featured");
const grid = document.getElementById("grid");
const search = document.getElementById("search");

const player = document.getElementById("player");
const frame = document.getElementById("frame");

const sidebar = document.getElementById("episodeSidebar");
const episodesDiv = document.getElementById("episodes");
const seasonSelect = document.getElementById("seasonSelect");

fetch(DATA_URL)
.then(r => r.json())
.then(data => {
    allData = data;
    renderFeatured(data.filter(i => i.featured));
    renderGrid(data);
});

search.oninput = () => {
    const q = search.value.toLowerCase();
    renderGrid(allData.filter(i => i.title.toLowerCase().includes(q)));
};

function renderFeatured(list) {
    featured.innerHTML = "";
    list.forEach(i => createCard(i, featured));
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(i => createCard(i, grid));
}

function createCard(item, parent) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${item.poster}"><div>${item.title}</div>`;
    div.onclick = () => openItem(item);
    parent.appendChild(div);
}

function openItem(item) {
    if (item.type === "movie") {
        openPlayer(item.url);
        sidebar.style.display = "none";
    } else {
        openShow(item);
    }
}

function openPlayer(url) {
    frame.src = url;
    player.style.display = "flex";
}

function closePlayer() {
    frame.src = "";
    player.style.display = "none";
    sidebar.style.display = "none";
    if (document.fullscreenElement) document.exitFullscreen();
}

function toggleFullscreen() {
    if (!document.fullscreenElement) player.requestFullscreen();
    else document.exitFullscreen();
}

/* TV SHOWS */
function openShow(show) {
    currentShow = show;
    sidebar.style.display = "flex";
    openPlayer(show.seasons[0].episodes[0].url);

    seasonSelect.innerHTML = "";
    show.seasons.forEach((s, i) => {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = "Season " + s.season;
        seasonSelect.appendChild(o);
    });

    seasonSelect.onchange = () => loadSeason(+seasonSelect.value);
    loadSeason(0);
}

function loadSeason(i) {
    episodesDiv.innerHTML = "";
    currentShow.seasons[i].episodes.forEach(e => {
        const div = document.createElement("div");
        div.className = "episode";
        div.textContent = e.title;
        div.onclick = () => openPlayer(e.url);
        episodesDiv.appendChild(div);
    });
}

function toggleEpisodes() {
    sidebar.style.display = sidebar.style.display === "flex" ? "none" : "flex";
}
</script>

</body>
</html>
